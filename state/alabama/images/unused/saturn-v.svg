<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration of a Saturn V rocket lifting off">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2540"/><stop offset="1" stop-color="#c25a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="40" cy="30" r="1.5"/><circle cx="120" cy="60" r="1"/><circle cx="330" cy="40" r="1.5"/>
    <circle cx="290" cy="90" r="1"/><circle cx="70" cy="110" r="1"/><circle cx="360" cy="120" r="1"/>
  </g>
  <!-- exhaust -->
  <ellipse cx="200" cy="228" rx="70" ry="14" fill="#f4c26b" opacity="0.7"/>
  <path d="M176 200 L224 200 L214 240 L186 240 Z" fill="#f08a3c"/>
  <!-- rocket -->
  <path d="M200 20 C210 40 212 60 212 70 L212 196 L188 196 L188 70 C188 60 190 40 200 20 Z" fill="#f4f4f5"/>
  <rect x="188" y="92" width="24" height="12" fill="#18181a"/>
  <rect x="188" y="136" width="24" height="12" fill="#18181a"/>
  <rect x="188" y="170" width="24" height="26" fill="#d9d9dc"/>
  <path d="M188 168 L168 200 L188 196 Z" fill="#c9c9cd"/>
  <path d="M212 168 L232 200 L212 196 Z" fill="#c9c9cd"/>
  <!-- ground -->
  <rect y="236" width="400" height="24" fill="#18181a"/>
</svg>
